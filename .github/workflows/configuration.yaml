name: readskills deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Generate application key
      run: | 
        cp .env.example .env
        php artisan key:generate
        
    - name: Run database migrations
      run: php artisan migrate --force

    - name: Install NPM dependencies & build assets
      run: |
        npm install
        npm run prod

    - name: Transfer files to server
      run: |
        ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "mkdir -p /path/to/your/laravel/app"
        scp -r . ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/path/to/your/laravel/app
